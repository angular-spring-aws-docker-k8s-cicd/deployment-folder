apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurantapp
  labels:
    app: restaurantapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurantapp
  template:
    metadata:
      labels:
        app: restaurantapp
    spec:
      # CRITICAL FIX 1: REMOVE hostNetwork: true 
      # hostNetwork: true # <--- THIS LINE MUST BE DELETED!
      containers:
        - name: restaurantapp
          image: harigoutham/restaurant-listing-service:15
          imagePullPolicy: Always
          ports:
            - containerPort: 9091
          env:
            # FIX 2: Inject the Eureka Service FQDN from the ConfigMap
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: eureka_service_address
            # FIX 3: Tell Eureka to register using the Pod's internal IP
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "true"
              
            # Your existing database variables follow:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mysql-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mysql-password
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: restaurantdb_url

---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
spec:
  ports:
    - protocol: TCP
      port: 9091
      targetPort: 9091
  selector:
    app: restaurantapp
